openapi: 3.2.0
info:
  title: BusUp Check In API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: CheckIn
paths:
  /v2/check-in/{check_in}:
    post:
      tags:
      - CheckIn
      summary: Delete Check In Student
      operationId: DeleteCheckIn
      parameters:
      - name: check-in
        in: path
        description: Id check in
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
      security:
      - api_key: []
