openapi: 3.2.0
info:
  title: BusUp Commuting Companies API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Commuting Companies
paths:
  commuting/companies:
    get:
      tags:
      - Commuting Companies
      summary: Find All companies of commuting
      description: Returns all comuting companies
      operationId: index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
  /commuting/company/{commutingCompany}:
    get:
      tags:
      - Commuting Companies
      summary: Find a specific company of commuting
      description: Returns a specific company of commuting
      operationId: Show
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
  commuting/allCompanies:
    get:
      tags:
      - Commuting Companies
      summary: Find All companies of commuting
      description: Returns all comuting companies
      operationId: Index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
