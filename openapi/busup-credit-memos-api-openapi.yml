openapi: 3.2.0
info:
  title: BusUp Credit Memos API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Credit Memos
paths:
  /credit_memos:
    get:
      tags:
      - Credit Memos
      summary: Find All credits
      description: Returns all credits
      operationId: index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
  /credit_memos/{credit_memo}:
    get:
      tags:
      - Credit Memos
      summary: Find a specific credit memo
      description: Returns a specific credit memo
      operationId: getCreditMemosByCreditMemo
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
      x-operation-id-source: normalized
      x-operation-id-original: index
