openapi: 3.2.0
info:
  title: BusUp Invoices API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Invoices
paths:
  /invoices:
    get:
      tags:
      - Invoices
      summary: Find All invoices
      description: Returns all invoices
      operationId: index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
  /invoices/{invoice}:
    get:
      tags:
      - Invoices
      summary: Find a specific invoice
      description: Returns a specific invoice
      operationId: getInvoicesByInvoice
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
      x-operation-id-source: normalized
      x-operation-id-original: index
