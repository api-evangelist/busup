openapi: 3.2.0
info:
  title: BusUp Leisure Companies API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Leisure Companies
paths:
  /companies:
    get:
      tags:
      - Leisure Companies
      summary: Find All companies of leisure
      description: Returns all leisure companies
      operationId: index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
  /companies/{companyResource}:
    get:
      tags:
      - Leisure Companies
      summary: Find a specific company of leisure
      description: Returns a specific leisure company
      operationId: Show
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
