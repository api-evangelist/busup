openapi: 3.2.0
info:
  title: BusUp Orders API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Orders
paths:
  /orders:
    get:
      tags:
      - Orders
      summary: Find All orders
      description: Returns all orders
      operationId: index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
  /orders/{order}:
    get:
      tags:
      - Orders
      summary: Find a specific order
      description: Returns a specific order
      operationId: Show
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
