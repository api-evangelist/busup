openapi: 3.2.0
info:
  title: BusUp Promoters API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Promoters
paths:
  /promoters:
    get:
      tags:
      - Promoters
      summary: Find all the promoters
      description: Returns all the promoters
      operationId: index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
  /promoters/{promoter}:
    get:
      tags:
      - Promoters
      summary: Find a speficic promoter
      description: Returns a specific promoter
      operationId: Show
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: credits not found
