openapi: 3.2.0
info:
  title: BusUp Route Stops API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Route Stops
paths:
  /route_stops/{id}:
    get:
      tags:
      - Route Stops
      summary: Find a specific Route Stop
      description: Returns a specific Stop of a Route
      operationId: show
      parameters:
      - name: id
        in: path
        description: The ID of the Route Stop
        required: true
        schema:
          type: integer
      - name: included
        in: path
        description: Include model relationships
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthenticated
        '404':
          description: 'Not found: Model or Relationship'
        '500':
          description: The action could not be completed
      security:
      - api_key: []
