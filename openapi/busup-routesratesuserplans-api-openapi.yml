openapi: 3.2.0
info:
  title: BusUp Routes Rates User Plans API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: RoutesRatesUserPlans
paths:
  /commuting/user-plans/information-route-rate-plan/{routesRateUserPlans}:
    get:
      tags:
      - RoutesRatesUserPlans
      summary: Find a route rates user plans
      description: Returns a route rates user plans
      operationId: ShowRouteRatePlan
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
  /commuting/user-plans/cancelation-journey-plan:
    post:
      tags:
      - RoutesRatesUserPlans
      summary: Cancel a Travel/UserPlan
      description: Cancel a Travel/UserPlan form RoutesRatesUserPlans
      operationId: cancelationJourneyPlan
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthenticated
        '404':
          description: 'Not found: Model'
        '500':
          description: The action could not be completed
      security:
      - api_key: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                canceled_by_user:
                  type: integer
                  description: The ID of the Admin that triggers the cancelation
                route_rate_user_plans_id:
                  type: integer
                  description: The ID of the Travel/UserPlan from RoutesRatesUserPlans
                amount:
                  type: integer
                  description: Amount to refund. This value is multiplied by 100 to be an integer
                credits:
                  type: integer
                  description: Credits to refund. The value is multiplied by 100 to be an integer
                date_canceled:
                  type: string
                  description: Date of cancelation in UTC. If the date is in the future, the cancelation will be scheduled
                transaction:
                  type: string
                  description: A token of an external transaction that represents the refund
              required:
              - canceled_by_user
              - route_rate_user_plans_id
              - amount
              - credits
              - date_canceled
