openapi: 3.2.0
info:
  title: BusUp Student API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Student
paths:
  /v2/student/{student}/check-in:
    post:
      tags:
      - Student
      summary: Check In Student
      operationId: CheckIn
      parameters:
      - name: included
        in: query
        description: includes relations
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
      security:
      - api_key: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: timestamp
        required: true
  /v2/student/create:
    post:
      tags:
      - Student
      summary: Create Student
      operationId: CreateStudent
      parameters:
      - name: included
        in: query
        description: includes relations
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
      security:
      - api_key: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: lastname student
        required: true
  /students:
    get:
      tags:
      - Student
      summary: Find all Studens
      description: Returns all Students
      operationId: index
      parameters:
      - name: filter.*.attribute
        in: path
        description: 'Filter Attribute. Ex: id'
        required: true
        schema:
          type: array
          items:
            type: string
      - name: filter.*.operator
        in: path
        description: 'Filter Operator. Ex: ='
        required: true
        schema:
          type: array
          items:
            type: string
      - name: filter.*.value
        in: path
        description: 'Filter Value. Ex: 1'
        required: true
        schema:
          type: array
          items:
            type: string
      - name: filter.*.scope
        in: path
        description: 'Filter Scope. Ex: local'
        required: true
        schema:
          type: array
          items:
            type: string
      - name: included
        in: path
        description: Include model relationships
        required: true
        schema:
          type: string
      - name: per_page
        in: path
        description: Load N entries per page
        required: true
        schema:
          type: integer
      - name: page
        in: path
        description: Load page N
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthenticated
        '404':
          description: 'Not found: Model, Method or Relationship'
        '500':
          description: The action could not be completed
      security:
      - api_key: []
