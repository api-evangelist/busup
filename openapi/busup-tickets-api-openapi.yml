openapi: 3.2.0
info:
  title: BusUp Tickets API
  description: BusUp API version 2
  contact:
    email: christian@busup.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: http://api.busup.local/v2
tags:
- name: Tickets
paths:
  /tickets:
    get:
      tags:
      - Tickets
      summary: Find All the tickets
      description: Returns all the tickets
      operationId: index
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
  /tickets/{ticket}:
    get:
      tags:
      - Tickets
      summary: Find a specific tickets
      description: Returns a specific tickets
      operationId: Show
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
